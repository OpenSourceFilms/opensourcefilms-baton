name: BATON standalone self-check
on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/selfcheck.yml"
      - "baton.py"
      - "tests/**"
      - "TEMPLATE.md"
  pull_request:
    paths:
      - ".github/workflows/selfcheck.yml"
      - "baton.py"
      - "tests/**"
      - "TEMPLATE.md"
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: baton-selfcheck-${{ github.ref }}
  cancel-in-progress: true
jobs:
  selfcheck:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.11"
      - name: Run hook, budget, latency and probe checks
        run: bash tests/selfcheck.sh
